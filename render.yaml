services:
  - type: web
    name: roadwatch-backend
    runtime: node
    rootDir: roadwatch-backend
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: OVERDUE_CRON_SCHEDULE
        value: "0 * * * *"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
